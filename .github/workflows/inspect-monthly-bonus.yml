name: Inspect monthly bonus and gym logging

on:
  push:
    branches:
      - inspect-pokemon-monthly-bonus
    paths-ignore:
      - monthly-bonus-inspection.txt

permissions:
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: inspect-pokemon-monthly-bonus
      - name: Extract relevant excerpts
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8", errors="replace")
          terms=[
              "caughtDates","monthly bonus","Monthly Bonus","adminMonthlyBonus",
              "loadAdminMonthlyBonus","renderAdminMonthlyBonus","monthlyBonus",
              "gym","Gym","caughtBooks","catchDate","date caught","caughtDate",
              "logGym","saveGym","gym catch","team catch","bonus multiplier"
          ]
          out=[]
          seen=[]
          for term in terms:
              start=0
              count=0
              while count<30:
                  i=s.find(term,start)
                  if i<0: break
                  a=max(0,i-2500); b=min(len(s),i+7000)
                  key=(a,b)
                  if key not in seen:
                      seen.append(key)
                      out.append(f"\n\n===== TERM {term!r} AT {i} =====\n"+s[a:b])
                  start=i+len(term)
                  count+=1
          Path("monthly-bonus-inspection.txt").write_text("".join(out),encoding="utf-8")
          print("wrote",len(out),"excerpts")
          PY
      - name: Commit inspection output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add monthly-bonus-inspection.txt
          git commit -m "Temporary monthly bonus inspection" || exit 0
          git push origin HEAD:inspect-pokemon-monthly-bonus
