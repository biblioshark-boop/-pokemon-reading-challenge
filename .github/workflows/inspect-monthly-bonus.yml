name: Inspect monthly bonus and gym logging

on:
  push:
    branches:
      - inspect-pokemon-monthly-bonus
    paths-ignore:
      - monthly-bonus-compact.txt
      - monthly-bonus-inspection.txt

permissions:
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: inspect-pokemon-monthly-bonus
      - name: Extract compact relevant excerpts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path("index.html").read_text(encoding="utf-8", errors="replace")
          out=[]

          def add(label, start, end):
              out.append(f"\n===== {label} =====\n"+s[start:end])

          # Exact useful terms; only first few matches, small windows.
          terms=[
            "caughtDates",
            "Monthly Bonus",
            "monthly bonus",
            "adminMonthlyBonus",
            "loadAdminMonthlyBonus",
            "saveAdminMonthlyBonus",
            "catchDate",
            "caughtDate",
            "logGym",
            "saveGym",
            "Gym Battle",
            "gym",
            "caughtBooks"
          ]
          seen=set()
          for term in terms:
              start=0
              hits=0
              while hits<5:
                  i=s.find(term,start)
                  if i<0: break
                  a=max(0,i-1200); b=min(len(s),i+2600)
                  key=(a,b)
                  if key not in seen:
                      seen.add(key); add(f"{term} @ {i}",a,b)
                  start=i+len(term); hits+=1

          # Try to capture whole function bodies by name if present.
          for name in [
            "loadAdminMonthlyBonusPeriods","loadAdminMonthlyBonusEditor",
            "saveAdminMonthlyBonusPeriod","renderAdminMonthlyBonus",
            "getActiveMonthlyBonus","getMonthlyBonus",
            "logGym","saveGym","completeGym","recordGym",
            "saveCatch","catchPokemon","logCatch","openPokemon"
          ]:
              m=re.search(rf"(?:async\s+)?function\s+{re.escape(name)}\s*\(",s)
              if m:
                  a=m.start(); b=min(len(s),a+9000)
                  add(f"FUNCTION {name}",a,b)

          Path("monthly-bonus-compact.txt").write_text("".join(out)[:90000],encoding="utf-8")
          print("compact chars",min(len("".join(out)),90000))
          PY
      - name: Commit compact output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add monthly-bonus-compact.txt
          git commit -m "Compact monthly bonus inspection" || exit 0
          git push origin HEAD:inspect-pokemon-monthly-bonus
